# gastubos/docker-compose.yml
# Levanta únicamente PostgreSQL para desarrollo local — comodidad para no
# instalar Postgres nativo en la PC del desarrollador. Backend y frontend
# corren fuera de Docker en todos los ambientes (local, dev, prod, Cryopar):
# ver "Ambientes desplegados" en README.md. No hay Dockerfile de backend/
# frontend en este repo ni contenedores en el VPS.

services:

  postgres:
    image: postgres:16-alpine
    container_name: gastubos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     gastubos
      POSTGRES_PASSWORD: gastubos123
      POSTGRES_DB:       gastubos_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
